<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Dream Wave AI — students, institutions, and companies on one intelligent platform." />
  <meta name="theme-color" content="#070A12" />
  <meta property="og:title" content="Dream Wave AI" />
  <meta property="og:description" content="AI-powered ecosystem for learning, institutions, and hiring." />
  <meta property="og:type" content="website" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌊</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <title>Dream Wave AI</title>
  <style>
    #boot {
      position: fixed; inset: 0; z-index: 99999;
      display: grid; place-items: center;
      background: #070A12;
      color: #F8FAFC;
      font-family: 'Space Grotesk', Inter, system-ui, sans-serif;
      transition: opacity 0.35s ease;
    }
    #boot.hide { opacity: 0; pointer-events: none; }
    #boot p { margin: 0; letter-spacing: 0.18em; text-transform: uppercase; font-size: 0.75rem; color: rgba(148,163,184,0.9); }
  </style>
</head>
<body>
  <div id="boot"><p>Dream Wave AI</p></div>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
  <script>
    (function () {
      const boot = document.getElementById('boot')
      function hide() {
        if (!boot || boot._h) return
        boot._h = true
        boot.classList.add('hide')
        setTimeout(function () { boot.parentNode && boot.parentNode.removeChild(boot) }, 400)
      }
      const obs = new MutationObserver(function () {
        if (document.getElementById('root').childElementCount > 0) {
          obs.disconnect()
          hide()
        }
      })
      obs.observe(document.getElementById('root'), { childList: true })
      setTimeout(hide, 2500)
    })()
  </script>
</body>
</html>
